services:
  mysql:
    image: mysql:8
    container_name: savorly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: savorly_f4533b8f
    ports:
      - "3306:3306"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: savorly-frontend
    ports:
      - "4000:4000"
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - appnet
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: savorly-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=savorly_f4533b8f
      - APP_KEY=base64:c2F2b3JseWFwcGtleXNlY3JldDEyMzQ1Njc4OTAxMjM=
      - CORS_ALLOWED_ORIGINS=http://localhost:4000,http://frontend:4000
    networks:
      - appnet
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  appnet:
    driver: bridge